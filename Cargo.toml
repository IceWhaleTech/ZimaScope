[workspace]
resolver = "3"
members = ["xtask", "zimascope-agent", "zimascope-common", "zimascope-ebpf"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
hashbrown = "0.16"
maxminddb = "0.31"
network-types = { version = "0.2", default-features = false }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
