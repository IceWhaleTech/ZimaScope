<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="See where your ZimaOS traffic flows. Local-first network observability at the device boundary." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <title>ZimaScope</title>
    <script>
      // Resolve the appearance preference before first paint so the theme
      // never flashes. The React ThemeProvider takes over afterwards.
      (() => {
        const stored = localStorage.getItem("zimascope.theme");
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : system;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
